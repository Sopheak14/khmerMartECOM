<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verify Your Email - KhmerMart</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f7fafc; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 30px; border: 1px solid #e2e8f0;">
        <h2 style="color: #2b6cb0;">Welcome to KhmerMart!</h2>
        <p>Hello <span th:text="${fullName}">Customer</span>,</p>
        <p>Thank you for creating an account with KhmerMart. Please confirm your email address by clicking the link below:</p>
        <div style="margin: 30px 0;">
            <a th:href="${verificationUrl}" style="background-color: #3182ce; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 4px; font-weight: bold;">Verify Email Address</a>
        </div>
        <p style="color: #718096; font-size: 14px;">Or copy and paste this URL into your browser:<br/><span th:text="${verificationUrl}"></span></p>
        <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 20px 0;" />
        <p style="color: #a0aec0; font-size: 12px;">KhmerMart Cambodia • Online Shopping Platform</p>
    </div>
</body>
</html>
