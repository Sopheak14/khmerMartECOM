server:
  port: ${PORT:4000}
  shutdown: graceful
  tomcat:
    relaxed-query-chars: "[,]"

spring:
  application:
    name: khmermart-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC

springdoc:
  swagger-ui:
    path: /api/docs
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  public-api-url: ${PUBLIC_API_URL:http://localhost:4000}
  upload-dir: ${UPLOAD_DIR:uploads}
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:khmermart_default_secure_access_secret_key_32_chars_min}
    refresh-secret: ${JWT_REFRESH_SECRET:khmermart_default_secure_refresh_secret_key_32_chars_min}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
  mail:
    from: ${MAIL_FROM:KhmerMart <no-reply@khmermart.local>}
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:admin@khmermart.local}
  khqr:
    mode: ${KHQR_MODE:MOCK}
    type: ${KHQR_TYPE:INDIVIDUAL}
    api-base: ${BAKONG_API_BASE:https://api-bakong.nbc.gov.kh}
    token: ${BAKONG_TOKEN:}
    token-expires-at: ${BAKONG_TOKEN_EXPIRES_AT:}
    account-id: ${BAKONG_ACCOUNT_ID:khmermart@aclb}
    merchant-id: ${BAKONG_MERCHANT_ID:}
    acquiring-bank: ${BAKONG_ACQUIRING_BANK:}
    merchant-name: ${BAKONG_MERCHANT_NAME:KhmerMart}
    merchant-city: ${BAKONG_MERCHANT_CITY:Phnom Penh}
    mobile: ${BAKONG_MOBILE:85512345678}
    store-label: ${BAKONG_STORE_LABEL:KhmerMart Online}
    terminal-label: ${BAKONG_TERMINAL_LABEL:WEB-01}
    deeplink-url: ${BAKONG_DEEPLINK_URL:}
    currency: ${KHQR_CURRENCY:USD}
    expire-minutes: ${KHQR_EXPIRE_MINUTES:10}
    poll-interval-seconds: ${KHQR_POLL_INTERVAL_SECONDS:5}
    usd-khr-rate: ${USD_KHR_RATE:4100}
