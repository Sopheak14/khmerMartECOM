spring:
  config:
    # Dev only (tests use the 'test' profile and never see this): load back_end/.env if present.
    # Real environment variables still take precedence over the file.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/khmermart}
    username: ${DB_USER:khmermart}
    password: ${DB_PASSWORD:khmermart}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

logging:
  level:
    com.khmermart: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
