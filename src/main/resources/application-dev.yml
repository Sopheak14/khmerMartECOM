spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/khmermart}
    username: ${DB_USER:khmermart}
    password: ${DB_PASSWORD:khmermart}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

logging:
  level:
    com.khmermart: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
